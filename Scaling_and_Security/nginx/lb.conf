# 3 backends, round-robin, with automatic failover (the AFTER config for Q1c).
upstream backend_pool {
    server backend1:8080 max_fails=1 fail_timeout=10s;
    server backend2:8080 max_fails=1 fail_timeout=10s;
    server backend3:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast on a dead instance, then retry the same request elsewhere.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        add_header X-Upstream $upstream_addr always;   # shows which container answered
    }
}
